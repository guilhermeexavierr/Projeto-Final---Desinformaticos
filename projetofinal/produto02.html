<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Tablet para estudo - Detalhes</title>
</head>
<body>

    <header>
        <h1 class="logo"><span class="vermelho">DES</span>INFORMATICOS</h1>
        <nav>
            <a class="links" href="index.html">Início</a>
            <a class="links" href="produtos.html">Produtos</a>
        </nav>
    </header>

    <main class="main-detalhes">
        <section class="box-detalhes">
            <img class="imagem-detalhe" src="imagens/imagem02.jpg" alt="Tablet para estudo">
            <div class="conteudo-detalhe">
                <h2>Tablet para estudo</h2>
                <p>Especificações Técnicas:</p>
                <ul>
                    <li>4 GB RAM.</li>
                    <li>64 GB Armazenamento.</li>
                    <li>Tela de 10 polegadas.</li>
                </ul>
                <h2>R$ 3.400,00</h2>
            </div>
        </section>

        <section class="box-formulario">
            <h2>Fazer Pedido</h2>
            <form action="processa.php" method="POST" onsubmit="confirmarPedido()">
                <label for="produto">Produto:</label>
                <input type="text" name="produto" id="produto" value="Tablet para estudo" readonly>

                <label for="nome">Nome Completo:</label>
                <input type="text" name="nome" id="nome" required>

                <label for="email">E-mail de Contato:</label>
                <input type="email" name="email" id="email" required>

                <label for="quantidade">Quantidade:</label>
                <input type="text" name="quantidade" id="quantidade" value="1" required>

                <label for="endereco">Endereço de Entrega:</label>
                <input type="text" name="endereco" id="endereco" required>

                <label for="pagamento">Forma de Pagamento:</label>
                <select name="pagamento" id="pagamento">
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Boleto">Boleto</option>
                </select>

                <input type="submit" value="Comprar" class="botao-comprar">
            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
